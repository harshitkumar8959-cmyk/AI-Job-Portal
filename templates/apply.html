<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Apply for Job - AI Job Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow border-0">
        <div class="card-header bg-success text-white py-3">
            <h4 class="mb-0">Apply for {{ job['title'] }}</h4>
            <small>{{ job['company'] }}</small>
        </div>
        <div class="card-body p-4">
            <div class="alert alert-info py-2">
                Applying as: <b>{{ session.get('name') }}</b> ({{ session.get('email') }})
            </div>
            <form action="/apply/{{ job['id'] }}" method="POST" enctype="multipart/form-data">
                <div class="mb-4">
                    <label class="form-label fw-bold">Upload Your Resume (PDF only)</label>
                    <input type="file" name="resume" class="form-control" accept=".pdf" required>
                    <small class="text-muted">Our AI engine will parse competencies, compute match rating, and extract contact details.</small>
                </div>
                <button type="submit" class="btn btn-success w-100 py-2">Submit & Run AI Evaluation</button>
            </form>
            <div class="text-center mt-3">
                <a href="/" class="text-secondary">&larr; Back to Job Board</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
