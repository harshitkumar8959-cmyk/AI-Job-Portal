<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Post a Job</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 650px;">
    <div class="card shadow border-0">
        <div class="card-header bg-primary text-white"><h4>Create Vacancy Posting</h4></div>
        <div class="card-body p-4">
            <form action="/post-job" method="POST">
                <div class="mb-3">
                    <label class="form-label fw-bold">Job Role / Designation</label>
                    <input type="text" name="title" class="form-control" placeholder="e.g. Python Backend Engineer" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Company / Organization</label>
                    <input type="text" name="company" class="form-control" placeholder="e.g. Tata Consultancy Services" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">AI Screening Cut-off Score (%)</label>
                    <input type="number" name="cutoff_score" class="form-control" value="40" min="10" max="90" required>
                    <small class="text-muted">Applications achieving this score or higher get marked as 'Shortlisted' automatically.</small>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Job Description & Expected Skills</label>
                    <textarea name="description" class="form-control" rows="5" placeholder="Skills required: Python, Flask, SQL, Machine Learning, Docker, Git..." required></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2">Publish Job Opening</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
